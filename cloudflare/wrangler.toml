# Deploy: npx wrangler deploy (de dentro desta pasta, logado na conta do Cloudflare onde está o lyrioapp.com)
name = "lyrio-blog-proxy"
main = "blog-proxy.js"
compatibility_date = "2026-10-01"
workers_dev = false

# Só estes caminhos passam pelo Worker; o resto do lyrioapp.com nem o toca. Idioma novo no blog = rota nova aqui.
routes = [
  { pattern = "lyrioapp.com/blog-static/*", zone_name = "lyrioapp.com" },
  { pattern = "lyrioapp.com/blog-sitemap.xml", zone_name = "lyrioapp.com" },
  { pattern = "lyrioapp.com/robots.txt", zone_name = "lyrioapp.com" },
  { pattern = "lyrioapp.com/llms.txt", zone_name = "lyrioapp.com" },
