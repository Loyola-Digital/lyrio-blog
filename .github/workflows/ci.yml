name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres
      SESSION_SECRET: ci-only-secret
      SITE_URL: https://blog.lyrioapp.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/migrate.ts
      - run: npm test # inclui o teste contra o Postgres de verdade (TEST_DATABASE_URL)
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm run build # sem banco de propósito: o build não pode depender dele (como na Vercel antes da Neon)
        env:
          DATABASE_URL: ''
